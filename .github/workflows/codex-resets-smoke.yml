name: Codex Resets contract probe

on:
  push:
    branches: [codex/migrate-to-codex-resets-api]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public API contract (no credentials)
        shell: python
        run: |
          import json, urllib.request
          request = urllib.request.Request('https://codex-resets.com/api/openapi.json', headers={'User-Agent': 'CodexRadar-contract-verification'})
          with urllib.request.urlopen(request, timeout=30) as response:
              spec = json.load(response)
          print(json.dumps(spec, ensure_ascii=False, indent=2))
