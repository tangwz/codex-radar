name: Codex Resets migration tests

on:
  push:
    branches: [codex/migrate-to-codex-resets-api]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-resets-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Test public API integration
        run: swift test --filter 'CodexResets|ResetForecast|ResetHistory|ResetNotification|ResetRadarPresentation|ConsumedResetSignal|DashboardStoreForecast'
