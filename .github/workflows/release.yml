name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Signing mode for the manual package-only preflight
        required: true
        type: choice
        options:
          - adhoc
          - developer-id
        default: adhoc
      release_channel:
        description: Channel constraint for the manual package-only preflight
        required: true
        type: choice
        options:
          - prerelease
          - stable
        default: prerelease

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      signing_mode: ${{ steps.mode.outputs.signing_mode }}
      release_prerelease: ${{ steps.mode.outputs.release_prerelease }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release metadata and main ancestry
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          case "$EVENT_NAME" in
            push)
              ./script/validate_release.sh "$RELEASE_TAG" "$RELEASE_SHA" refs/remotes/origin/main
              ;;
            workflow_dispatch)
              ./script/validate_release.sh "" "$RELEASE_SHA" refs/remotes/origin/main
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          source ./script/lib/release_common.sh
          load_version ./version.env
          printf 'version=%s\n' "$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=codex-radar-v%s-macos-universal\n' \
            "$MARKETING_VERSION" >> "$GITHUB_OUTPUT"

      - name: Select tag release or manual preflight mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          MANUAL_SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push)
              signing_mode=adhoc
              release_channel=prerelease
              ;;
            workflow_dispatch)
              signing_mode="$MANUAL_SIGNING_MODE"
              release_channel="$MANUAL_RELEASE_CHANNEL"
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          case "$signing_mode" in
            adhoc | developer-id) ;;
            *)
              echo "Unsupported signing mode" >&2
              exit 1
              ;;
          esac

          case "$release_channel" in
            prerelease)
              release_prerelease="true"
              ;;
            stable)
              release_prerelease="false"
              ;;
            *)
              echo "Unsupported release channel" >&2
              exit 1
              ;;
          esac

          source ./script/lib/release_common.sh
          validate_release_channel "$signing_mode" "$release_prerelease"
          printf 'signing_mode=%s\n' "$signing_mode" >> "$GITHUB_OUTPUT"
          printf 'release_prerelease=%s\n' \
            "$release_prerelease" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find script -type f -name '*.sh' -print0 | while IFS= read -r -d '' script_file; do
            bash -n "$script_file"
          done

      - name: Test release helpers
        shell: bash
        run: |
          set -euo pipefail
          ./script/tests/release_common_test.sh
          ./script/tests/publish_release_test.sh
          ./script/tests/workflow_contract_test.sh

      - name: Swift tests
        run: swift test

  package_adhoc:
    name: Ad-hoc package-only artifact
    needs: [metadata, validate]
    if: ${{ needs.metadata.result == 'success' && needs.validate.result == 'success' && needs.metadata.outputs.signing_mode == 'adhoc' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Package ad-hoc Universal 2 artifact
        shell: bash
        env:
          RELEASE_PRERELEASE: "true"
          SIGNING_MODE: adhoc
        run: |
          set -euo pipefail
          ./script/package_release.sh dist/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
          retention-days: 7
          if-no-files-found: error

  package_developer_id:
    name: Developer ID package-only preflight (signs and notarizes)
    needs: [metadata, validate]
    if: ${{ needs.metadata.result == 'success' && needs.validate.result == 'success' && needs.metadata.outputs.signing_mode == 'developer-id' }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Sign, notarize, and package Developer ID preflight
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.release_prerelease }}
          SIGNING_MODE: developer-id
        run: |
          set -euo pipefail
          umask 077

          : "${MACOS_CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${APP_STORE_CONNECT_API_KEY_P8:?Missing APP_STORE_CONNECT_API_KEY_P8}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"

          certificate_path="$RUNNER_TEMP/codex-radar-certificate.p12"
          keychain_path="$RUNNER_TEMP/codex-radar-signing.keychain-db"
          original_keychains_path="$RUNNER_TEMP/codex-radar-original-keychains"
          keychain_password="$(openssl rand -hex 32)"
          keychain_created="false"
          keychain_search_list_captured="false"
          KEYCHAIN_SEARCH_LIST=()

          load_keychain_search_list() {
            local list_path="$1"
            local keychain=""
            local load_status=0
            local -a parsed_keychains=()

            while IFS= read -r keychain || [[ -n "$keychain" ]]; do
              keychain="${keychain#"${keychain%%[![:space:]]*}"}"
              keychain="${keychain%"${keychain##*[![:space:]]}"}"
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              if [[ -n "$keychain" ]]; then
                parsed_keychains+=("$keychain")
              fi
            done < "$list_path"
            load_status="$?"
            if [[ "$load_status" -ne 0 ]]; then
              return "$load_status"
            fi

            KEYCHAIN_SEARCH_LIST=()
            if [[ "${#parsed_keychains[@]}" -gt 0 ]]; then
              for keychain in "${parsed_keychains[@]}"; do
                KEYCHAIN_SEARCH_LIST+=("$keychain")
              done
            fi
          }

          restore_keychain_search_list() {
            if [[ "${#KEYCHAIN_SEARCH_LIST[@]}" -eq 0 ]]; then
              security list-keychains -d user -s
            else
              security list-keychains -d user -s \
                "${KEYCHAIN_SEARCH_LIST[@]}"
            fi
          }

          activate_signing_keychain() {
            if [[ "${#KEYCHAIN_SEARCH_LIST[@]}" -eq 0 ]]; then
              security list-keychains -d user -s "$keychain_path"
            else
              security list-keychains -d user -s \
                "$keychain_path" "${KEYCHAIN_SEARCH_LIST[@]}"
            fi
          }

          cleanup() {
            local status="$?"
            local cleanup_status=0
            trap - EXIT INT TERM
            set +e

            if [[ "$keychain_search_list_captured" == "true" ]]; then
              load_keychain_search_list "$original_keychains_path"
              record_cleanup_status "$?"
              restore_keychain_search_list
              record_cleanup_status "$?"
            fi
            if [[ "$keychain_created" == "true" ]]; then
              security delete-keychain "$keychain_path"
              record_cleanup_status "$?"
            fi
            rm -f "$certificate_path" "$keychain_path" \
              "$original_keychains_path"
            record_cleanup_status "$?"

            if [[ "$status" -ne 0 ]]; then
              exit "$status"
            fi
            exit "$cleanup_status"
          }

          record_cleanup_status() {
            local command_status="$1"
            if [[ "$command_status" -ne 0 && "$cleanup_status" -eq 0 ]]; then
              cleanup_status="$command_status"
            fi
            return 0
          }

          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          security list-keychains -d user > "$original_keychains_path"
          chmod 600 "$original_keychains_path"
          load_keychain_search_list "$original_keychains_path"
          keychain_search_list_captured="true"

          printf '%s' "$MACOS_CERTIFICATE_P12" \
            | /usr/bin/base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"

          keychain_created="true"
          security create-keychain -p "$keychain_password" "$keychain_path"
          chmod 600 "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          activate_signing_keychain

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk '/Developer ID Application:/ { print $2; exit }'
          )"
          : "${signing_identity:?Missing Developer ID Application identity}"
          export MACOS_SIGNING_IDENTITY="$signing_identity"

          ./script/package_release.sh dist/release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: |
            dist/release/*.zip
            dist/release/*.zip.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [metadata, package_adhoc]
    if: ${{ always() && github.event_name == 'push' && needs.metadata.result == 'success' && needs.package_adhoc.result == 'success' && needs.metadata.outputs.signing_mode == 'adhoc' }}
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: dist/release

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.release_prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SIGNING_MODE: adhoc
        run: |
          set -euo pipefail
          ./script/publish_release.sh \
            "$RELEASE_TAG" \
            "dist/release/CodexRadar-v${RELEASE_VERSION}-macos-universal.zip" \
            "dist/release/CodexRadar-v${RELEASE_VERSION}-macos-universal.zip.sha256"
