name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Temporary bootstrap for the PR that installs the pull_request_target workflow on main.
  validate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 9 && github.event.pull_request.head.ref == 'codex/enforce-main-release-gates' && github.event.pull_request.head.repo.full_name == github.repository && 'validate' || 'bootstrap-disabled' }}
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 9 && github.event.pull_request.head.ref == 'codex/enforce-main-release-gates' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out target revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/"
          case "$(uname -m)" in
            arm64)
              archive="actionlint_1.7.12_darwin_arm64.tar.gz"
              archive_sha="aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f"
              ;;
            x86_64)
              archive="actionlint_1.7.12_darwin_amd64.tar.gz"
              archive_sha="5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644"
              ;;
            *)
              echo "unsupported actionlint architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive_path" "$base_url$archive"
          printf '%s  %s\n' "$archive_sha" "$archive_path" | shasum -a 256 -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir"
          "$install_dir/actionlint" -version

      - name: Lint workflows
        shell: bash
        run: |
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 "$RUNNER_TEMP/actionlint/actionlint"

      - name: Build with strict concurrency
        run: swift build -c release -Xswiftc -strict-concurrency=complete

      - name: Run validation suite
        shell: bash
        run: |
          set -euo pipefail
          # Swift Testing 124.4 can crash when AppKit-facing and core suites share a process.
          appkit_test_suites='MenuActionLayoutTests|MenuBarControllerTests|MenuBarPanelActionsTests|SettingsWindowBridgeTests'
          swift test --no-parallel --filter "$appkit_test_suites"
          swift test --no-parallel --skip "$appkit_test_suites"
          bash Tests/ScriptTests/release_common_tests.sh
          bash Tests/ScriptTests/package_verification_tests.sh
          bash Tests/ScriptTests/update_feed_tests.sh
          find script -name '*.sh' -print0 | xargs -0 -n1 bash -n
          ./script/package_app.sh --output dist/ci --configuration release --architectures "$(uname -m)" --updates-enabled false

  start-validation-check:
    name: start-validation-check
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      checks: write
    outputs:
      check_id: ${{ steps.required_check.outputs.check_id }}
    steps:
      - name: Start required validation check
        id: required_check
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            [[ "$BASE_REF" == main ]]
          fi
          check_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=validate \
            -f head_sha="$TARGET_SHA" \
            -f status=in_progress \
            --jq .id)"
          [[ "$check_id" =~ ^[0-9]+$ ]]
          echo "check_id=$check_id" >>"$GITHUB_OUTPUT"

  trusted-policy:
    name: trusted-policy
    needs: start-validation-check
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted validation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          path: trusted-source
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Check out target revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          path: target-source
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce trusted activation policy
        shell: bash
        env:
          ACTIVATION_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          ACTIVATION_TARGET_DIR: ${{ github.workspace }}/target-source
          GH_TOKEN: ${{ github.token }}
        run: trusted-source/script/verify_activation_pr.sh

  target-validation:
    name: target-validation
    needs: trusted-policy
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out target revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          path: target-source
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/rhysd/actionlint/releases/download/v1.7.12/"
          case "$(uname -m)" in
            arm64)
              archive="actionlint_1.7.12_darwin_arm64.tar.gz"
              archive_sha="aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f"
              ;;
            x86_64)
              archive="actionlint_1.7.12_darwin_amd64.tar.gz"
              archive_sha="5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644"
              ;;
            *)
              echo "unsupported actionlint architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive_path" "$base_url$archive"
          printf '%s  %s\n' "$archive_sha" "$archive_path" | shasum -a 256 -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir"
          "$install_dir/actionlint" -version

      - name: Lint workflows
        shell: bash
        working-directory: target-source
        run: |
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            xargs -0 "$RUNNER_TEMP/actionlint/actionlint"

      - name: Build with strict concurrency
        working-directory: target-source
        run: swift build -c release -Xswiftc -strict-concurrency=complete

      - name: Run validation suite
        shell: bash
        working-directory: target-source
        run: |
          set -euo pipefail
          # Swift Testing 124.4 can crash when AppKit-facing and core suites share a process.
          appkit_test_suites='MenuActionLayoutTests|MenuBarControllerTests|MenuBarPanelActionsTests|SettingsWindowBridgeTests'
          swift test --no-parallel --filter "$appkit_test_suites"
          swift test --no-parallel --skip "$appkit_test_suites"
          bash Tests/ScriptTests/release_common_tests.sh
          bash Tests/ScriptTests/package_verification_tests.sh
          bash Tests/ScriptTests/update_feed_tests.sh
          find script -name '*.sh' -print0 | xargs -0 -n1 bash -n
          ./script/package_app.sh --output dist/ci --configuration release --architectures "$(uname -m)" --updates-enabled false

  finalize-validation:
    name: finalize-validation
    if: ${{ always() && needs.start-validation-check.outputs.check_id != '' }}
    needs:
      - start-validation-check
      - trusted-policy
      - target-validation
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Complete required validation check
        shell: bash
        env:
          CHECK_ID: ${{ needs.start-validation-check.outputs.check_id }}
          GH_TOKEN: ${{ github.token }}
          POLICY_RESULT: ${{ needs.trusted-policy.result }}
          TARGET_RESULT: ${{ needs.target-validation.result }}
        run: |
          set -euo pipefail
          conclusion=failure
          if [[ "$POLICY_RESULT" == success && "$TARGET_RESULT" == success ]]; then
            conclusion=success
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            -f status=completed \
            -f conclusion="$conclusion" >/dev/null
